    <circle cx="430" cy="205" r="2.5" />
    <circle cx="430" cy="250" r="2.5" />
    <circle cx="430" cy="295" r="2.5" />
  </g>

  <!-- Core Motif Rotated and Transposed -->
  <g transform="translate(250, 250) rotate(0) scale(1) translate(-250, -250)">
    <!-- Core Symbol: Portal Launch -->
    <polygon points="250,110 370,180 370,320 250,390 130,320 130,180" fill="none" stroke="url(#tertiaryGrad)" stroke-width="8.399999999999999" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="60, 20, 140, 40" opacity="0.8" />
    <circle cx="250" cy="250" r="110" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="10, 15, 60, 20" opacity="0.4" />
    <path d="M 180,240 L 255,240 L 225,290 L 330,225 L 245,225 L 275,175 Z" fill="url(#accentGrad)" stroke="#ffffff" stroke-width="2" filter="url(#glow)" />
    <line x1="350" y1="210" x2="390" y2="185" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.7" />
    <line x1="110" y1="290" x2="150" y2="265" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" opacity="0.5" />
  </g>

  <!-- MacOS Glass Gloss Glaze Overlay to emulate a real desktop app style -->
  <path d="M 15,250 C 15,115 115,15 250,15 C 385,15 485,115 485,250 Z" fill="url(#glazeGrad)" pointer-events="none" />
  
  <!-- Subtle top rim border highlight for a premium glazed rim -->
  <path d="M 250,16 C 385,16 484,115 484,250" fill="none" stroke="rgba(255, 255, 255, 0.28)" stroke-width="2" stroke-linecap="round" pointer-events="none" />
</svg>