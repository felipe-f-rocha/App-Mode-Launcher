    <circle cx="205" cy="385" r="2.5" />
    <circle cx="205" cy="430" r="2.5" />
    <circle cx="250" cy="70" r="2.5" />
    <circle cx="250" cy="115" r="2.5" />
    <circle cx="250" cy="160" r="2.5" />
    <circle cx="250" cy="205" r="2.5" />
    <circle cx="250" cy="250" r="2.5" />
    <circle cx="250" cy="295" r="2.5" />
    <circle cx="250" cy="340" r="2.5" />
    <circle cx="250" cy="385" r="2.5" />
    <circle cx="250" cy="430" r="2.5" />
    <circle cx="295" cy="70" r="2.5" />
    <circle cx="295" cy="115" r="2.5" />
    <circle cx="295" cy="160" r="2.5" />
    <circle cx="295" cy="205" r="2.5" />
    <circle cx="295" cy="250" r="2.5" />
    <circle cx="295" cy="295" r="2.5" />
    <circle cx="295" cy="340" r="2.5" />
    <circle cx="295" cy="385" r="2.5" />
    <circle cx="295" cy="430" r="2.5" />
