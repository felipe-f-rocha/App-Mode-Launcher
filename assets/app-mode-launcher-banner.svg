<svg viewBox="0 0 650 180" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12.857142857142858" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Visual Gradients mapping color themes -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0c0e" />
      <stop offset="100%" stop-color="#1e1e24" />
    </linearGradient>

    <linearGradient id="bannerBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090915" stroke-opacity="0.6"/>
      <stop offset="100%" stop-color="#101026" stroke-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="tertiaryGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Banner Outer Card with soft border -->
  <rect x="5" y="5" width="640" height="170" rx="16" fill="url(#bannerBgGrad)" stroke="#222543" stroke-width="1.5" />

  <!-- Embedded Logo Nested on Left -->
  <g transform="translate(35, 30) scale(0.24)">
    
  <path d="M 250,25 L 445,137.5 L 445,362.5 L 250,475 L 55,362.5 L 55,137.5 Z" fill="url(#bgGrad)" stroke="#334155" stroke-width="4" />
    
