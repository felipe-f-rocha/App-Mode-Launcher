  <!-- Title & Subtitle Metadata text -->
  <text x="180" y="90" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="28px" font-weight="500" fill="#ffffff" letter-spacing="2px">App Mode Launcher</text>
  <text x="180" y="122" font-family="'JetBrains Mono', monospace" font-size="11px" font-weight="600" fill="#a1a1aa" letter-spacing="4px">LAUNCH SMARTER. FOCUS FASTER.</text>
  
